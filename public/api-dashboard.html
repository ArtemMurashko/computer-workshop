<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Мурашко Артём Александрович">
    <meta name="mric-day" content="day5">
    <title>API-дашборд</title>
    <style>
        :root {
            --primary: #2d3436;
            --accent: #0984e3;
            --bg: #f5f5f5;
            --card-bg: #ffffff;
            --text: #333;
        }
        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg);
            color: var(--text);
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
        header {
            background-color: var(--primary);
            color: var(--card-bg);
            padding: 16px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        header h1 {
            margin: 0;
            font-size: 1.4rem;
        }
        .refresh-btn {
            background-color: var(--bg);
            color: var(--text);
            border: 0;
            padding: 12px 20px;
            border-radius: 15px;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
            font-size: 0.95rem;
            font-weight: 500;
            cursor: pointer;
            transition: background-color 0.3s ease, color 0.3s ease;
        }
        .refresh-btn:hover:not(:disabled) {
            background-color: var(--accent);
            color: var(--bg);
        }
        .refresh-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        main {
            max-width: 1100px;
            margin: 32px auto;
            padding: 0 20px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
        }
        .card {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .card h2 {
            margin: 0 0 8px 0;
            font-size: 1.2rem;
            color: var(--primary);
            border-bottom: 2px solid var(--bg);
            padding-bottom: 8px;
        }
        .user-info {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            gap: 10px;
        }
        .user-avatar {
            width: 96px;
            height: 96px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid var(--accent);
        }
        .todo-list {
            list-style: none;
            padding: 0;
            margin: 0;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .todo-item {
            display: flex;
            align-items: flex-start;
            gap: 8px;
            font-size: 0.95rem;
            line-height: 1.4;
        }
        .todo-item.done span {
            text-decoration: line-through;
            color: #888;
        }
        .skeleton {
            background: linear-gradient(90deg, #e0e0e0 25%, #ececec 50%, #e0e0e0 75%);
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite;
            border-radius: 6px;
        }
        .skeleton-text {
            height: 18px;
            width: 100%;
        }
        .skeleton-text.short {
            width: 60%;
        }
        .skeleton-circle {
            width: 96px;
            height: 96px;
            border-radius: 50%;
            margin: 0 auto;
        }
        @keyframes shimmer {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }
    </style>
</head>
<body>
    <header>
        <h1>📊 API-дашборд</h1>
        <button id="reload-btn" class="refresh-btn">🔄 Обновить данные</button>
    </header>
    <main>
        <section class="card">
            <h2>🎭 Шутка дня</h2>
            <div id="joke-content"></div>
        </section>
        <section class="card">
            <h2>👤 Случайный пользователь</h2>
            <div id="user-content"></div>
        </section>
        <section class="card">
            <h2>✅ Список задач</h2>
            <div id="todos-content"></div>
        </section>
    </main>
    <script>
        const jokeContainer = document.getElementById('joke-content');
        const userContainer = document.getElementById('user-content');
        const todosContainer = document.getElementById('todos-content');
        const reloadBtn = document.getElementById('reload-btn');
        function renderSkeletons() {
            jokeContainer.innerHTML = `
                <div class="skeleton skeleton-text"></div>
                <div class="skeleton skeleton-text short" style="margin-top: 10px;"></div>
            `;
            userContainer.innerHTML = `
                <div class="skeleton skeleton-circle"></div>
                <div class="skeleton skeleton-text short" style="margin: 12px auto 0;"></div>
                <div class="skeleton skeleton-text" style="margin-top: 8px;"></div>
            `;
            todosContainer.innerHTML = Array(5).fill(`
                <div class="skeleton skeleton-text" style="margin-bottom: 10px;"></div>
            `).join('');
        }
        async function loadDashboardData() {
            reloadBtn.disabled = true;
            renderSkeletons();
            const jokeUrl = 'https://v2.jokeapi.dev/joke/Programming?type=twopart'
            const userUrl = 'https://randomuser.me/api/'
            const todosUrl = 'https://jsonplaceholder.typicode.com/todos?_limit=5'
            try {
                const [jokeRes, userRes, todosRes] = await Promise.all([
                    fetch(jokeUrl),
                    fetch(userUrl),
                    fetch(todosUrl)
                ]);
                if (!jokeRes.ok || !userRes.ok || !todosRes.ok) {
                    throw new Error('Один из серверов вернул ошибку');
                }
                const [jokeData, userData, todosData] = await Promise.all([
                    jokeRes.json(),
                    userRes.json(),
                    todosRes.json()
                ]);
                jokeContainer.innerHTML = `
                    <p><strong>${jokeData.setup}</strong></p>
                    <p>${jokeData.delivery}</p>
                `;
                const user = userData.results[0];
                userContainer.innerHTML = `
                    <div class="user-info">
                        <img src="${user.picture.large}" alt="Фото пользователя" class="user-avatar">
                        <strong>${user.name.first} ${user.name.last}</strong>
                        <p style="margin: 0; color: #555;">${user.email}</p>
                    </div>
                `;
                todosContainer.innerHTML = `
                    <ul class="todo-list">
                        ${todosData.map(todo => `
                            <li class="todo-item ${todo.completed ? 'done' : ''}">
                                <span>${todo.completed ? '☑️' : '⬜'}</span>
                                <span>${todo.title}</span>
                            </li>
                        `).join('')}
                    </ul>
                `;
            } catch (error) {
                console.error('Ошибка загрузки дашборда:', error);
                const errorMsg = '<p style="color: #ff4d4f;">❌ Не удалось загрузить данные</p>';
                jokeContainer.innerHTML = errorMsg;
                userContainer.innerHTML = errorMsg;
                todosContainer.innerHTML = errorMsg;
            } finally {
                reloadBtn.disabled = false;
            }
        }
        loadDashboardData();
        reloadBtn.addEventListener('click', loadDashboardData);
    </script>
</body>
</html>
